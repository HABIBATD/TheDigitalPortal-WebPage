<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0F2040"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#fav-bg)"/>
  <g transform="translate(6, 6)">
    <!-- Outer Cyan Hexagon Frame -->
    <polygon 
      points="74,12 132,46 132,102 74,136 16,102 16,46" 
      fill="none" 
      stroke="#1E3A5F" 
      stroke-width="12" 
      stroke-linejoin="round"
    />
    <!-- Inner Cyan Core -->
    <polygon 
      points="74,36 108,56 108,92 74,112 40,92 40,56" 
      fill="#00A9C6" 
      stroke="#00C8EE" 
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- Center Cutout -->
    <polygon 
      points="74,54 90,64 90,84 74,94 58,84 58,64" 
      fill="#0A1628" 
    />
    <!-- Trace Lines & Arrows -->
    <path d="M 64,74 L 6,74" fill="none" stroke="#00C8EE" stroke-width="6" stroke-linecap="round"/>
    <polygon points="0,74 12,66 12,82" fill="#00C8EE"/>

    <path d="M 84,88 L 68,106 L 46,124 L 38,132" fill="none" stroke="#00C8EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="32,140 36,126 48,134" fill="#00C8EE"/>
    <circle cx="68" cy="106" r="4" fill="#0A1628" stroke="#00C8EE" stroke-width="3"/>

    <path d="M 86,80 L 104,64 L 104,50 L 138,28" fill="none" stroke="#00C8EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="146,22 132,26 138,38" fill="#00C8EE"/>
    <circle cx="86" cy="80" r="4" fill="#0A1628" stroke="#00C8EE" stroke-width="3"/>
    <circle cx="104" cy="64" r="3.5" fill="#0A1628" stroke="#00C8EE" stroke-width="2.5"/>

    <path d="M 112,62 L 132,62 C 138,62 144,67 144,74 C 144,81 138,86 132,86 L 116,86" fill="none" stroke="#00C8EE" stroke-width="6" stroke-linecap="round"/>
    <circle cx="132" cy="62" r="3.5" fill="#00C8EE"/>
